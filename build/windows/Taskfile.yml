version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          PRODUCTION: '{{.PRODUCTION}}'
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.BINARY_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application into a `.exe` bundle
    cmds:
      - task: create:nsis:installer

  # 一键命令别名：打包并生成 Windows NSIS 安装包（含 WebView2 引导器）
  package:installer:
    summary: One-command build + NSIS installer for Windows
    cmds:
      - task: create:nsis:installer

  # 一键命令：生产构建并使用 WiX v4 生成 MSI 安装包
  package:msi:
    summary: One-command build + WiX MSI installer for Windows
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - wix build build/windows/msi/FlyQPro.wxs -arch {{.WIX_ARCH}} -d AppExe="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.BINARY_NAME}}.exe" -d AppIcon="{{.ROOT_DIR}}/build/windows/icons.ico" -d ProductVersion="{{.VERSION}}" -o "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msi"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      WIX_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else}}x64{{end}}'
      VERSION: '{{.VERSION | default "0.1.1"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icons.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}\build\windows\nsis"
      # Use the standard NSIS installation path so packaging also works when
      # the current terminal has not refreshed its PATH after installation.
      - powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{{.NSIS_PATH}}' '-DARG_WAILS_{{.ARG_FLAG}}_BINARY={{.ROOT_DIR}}\{{.BIN_DIR}}\{{.BINARY_NAME}}.exe' 'project.nsi'"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      NSIS_PATH: '{{.NSIS_PATH | default "C:\\Program Files (x86)\\NSIS\\makensis.exe"}}'

  run:
    cmds:
      - '{{.BIN_DIR}}\\{{.BINARY_NAME}}.exe'
