version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Creates a production build of the application
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          PRODUCTION: '{{.PRODUCTION | default "false"}}'
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=10.15"
      CGO_LDFLAGS: "-mmacosx-version-min=10.15"
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.BINARY_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.BINARY_NAME}}-arm64"
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.BINARY_NAME}}" "{{.BIN_DIR}}/{{.BINARY_NAME}}-amd64" "{{.BIN_DIR}}/{{.BINARY_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.BINARY_NAME}}-amd64" "{{.BIN_DIR}}/{{.BINARY_NAME}}-arm64"

  package:
    summary: Packages a production build of the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle

  # 一条命令完成：打包 .app → 制作可拖拽安装的 DMG（含 Applications 符号链接）
  # 依赖 package 任务产出的 .app，无需任何第三方依赖（仅用 macOS 自带 hdiutil）
  package:macdmg:
    summary: Packages a production build into a `.app` and wraps it in a draggable-install DMG
    deps:
      - task: package
    cmds:
      - rm -rf "{{.BIN_DIR}}/dmg-staging"
      - mkdir -p "{{.BIN_DIR}}/dmg-staging"
      - cp -R "{{.BIN_DIR}}/{{.APP_NAME}}.app" "{{.BIN_DIR}}/dmg-staging/"
      - ln -s /Applications "{{.BIN_DIR}}/dmg-staging/Applications"
      - hdiutil create -volname "{{.APP_NAME}}" -srcfolder "{{.BIN_DIR}}/dmg-staging" -ov -format UDZO "{{.BIN_DIR}}/{{.DMG_NAME}}"
      - rm -rf "{{.BIN_DIR}}/dmg-staging"
    vars:
      DMG_ARCH: '{{if eq .ARCH "amd64"}}x86_64{{else}}{{.ARCH}}{{end}}'
      DMG_NAME: '{{.APP_NAME}}-macos-{{.DMG_ARCH}}.dmg'


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/zh-Hans.lproj" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/zh_CN.lproj"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/zh-Hans.lproj/InfoPlist.strings "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/zh-Hans.lproj"
      - cp build/darwin/zh_CN.lproj/InfoPlist.strings "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/zh_CN.lproj"
      - cp "{{.BIN_DIR}}/{{.BINARY_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - plutil -insert LSHasLocalizedDisplayName -bool true "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist" 2>/dev/null || plutil -replace LSHasLocalizedDisplayName -bool true "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.BINARY_NAME}}'
