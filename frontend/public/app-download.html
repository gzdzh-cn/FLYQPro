<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="/logo.png">
  <title>App 下载</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}.wrap{width:min(960px,calc(100% - 32px));margin:0 auto;padding:48px 0}.card{background:#fff;border-radius:24px;padding:40px;box-shadow:0 16px 50px rgba(35,58,100,.1);display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:center}.brand{display:flex;align-items:center;gap:14px}.brand img{width:58px;height:58px;border-radius:14px;object-fit:cover}.brand .fallback{width:58px;height:58px;border-radius:14px;background:#3b82f6;color:white;display:grid;place-items:center;font-size:24px;font-weight:700}.eyebrow{font-size:14px;color:#718096;margin:26px 0 8px}.title{font-size:32px;margin:0 0 12px}.version{font-size:18px;color:#3b82f6;font-weight:600}.meta{color:#718096;margin:16px 0;line-height:1.8}.content{white-space:pre-wrap;color:#4a5568;line-height:1.8;background:#f8fafc;border-radius:12px;padding:16px}.download{margin-top:22px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px;padding:13px 28px;cursor:pointer}.download:disabled{background:#a0aec0;cursor:not-allowed}.qr{text-align:center;color:#718096;font-size:14px}.qr img{width:220px;height:220px;max-width:100%;border-radius:10px;border:1px solid #edf2f7}.hint{margin-top:14px;line-height:1.7}.state{grid-column:1/-1;text-align:center;padding:40px 0;color:#718096}.error{color:#e53e3e}.install{margin-top:26px;color:#718096;font-size:13px;line-height:1.7}.hidden{display:none}@media(max-width:680px){.wrap{padding:20px 0}.card{padding:24px;grid-template-columns:1fr;gap:24px}.title{font-size:26px}.qr{order:2}}
  </style>
</head>
<body>
  <main class="wrap"><section class="card">
    <div id="main"><div class="state">正在获取最新版本…</div></div>
    <div id="qr" class="qr hidden"></div>
  </section></main>
  <script>
    const packageName='cn.gzdzh.dzh3136_app';
    // 下载页部署在 dzh3136.cc，App 更新接口部署在独立后端域名。
    const apiBase='https://admingo.gzlingnan.com/';
    const pageUrl=location.href.split('#')[0];
    const main=document.getElementById('main'), qr=document.getElementById('qr');
    const escapeHtml=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const resolveBackendUrl=(value)=>{value=String(value||'');return !value?'':(/^https?:\/\//i.test(value)?value:`${apiBase}/${value.replace(/^\/+/,'')}`)};
    const size=(n)=>{n=Number(n)||0;const u=['B','KB','MB','GB'];let i=0;while(n>=1024&&i<3){n/=1024;i++}return `${n.toFixed(i?2:0)} ${u[i]}`};
    function render(data){
      if(!data||!data.hasUpdate){main.innerHTML='<div class="state">暂无可用版本</div>';return}
      const logoUrl=resolveBackendUrl(data.logo);
      const logo=logoUrl?`<img src="${escapeHtml(logoUrl)}" alt="logo" onerror="this.remove()">`:'<div class="fallback">A</div>';
      const site=escapeHtml(data.siteName||'App 下载');
      main.innerHTML=`<div class="brand">${logo}<strong>${site}</strong></div><div class="eyebrow">最新版本</div><h1 class="title">${escapeHtml(data.title||'App 新版本')}</h1><div class="version">v${escapeHtml(data.versionName)}（${escapeHtml(data.versionCode)}）</div><div class="meta">APK：${escapeHtml(data.fileName||'')}<br>大小：${size(data.fileSize)}<br>发布时间：${escapeHtml(data.publishTime||'-')}</div><div class="content">${escapeHtml(data.content||'暂无更新说明')}</div><button id="download" class="download">下载 APK</button><div class="install">安装说明：点击“下载 APK”后，下载完成打开安装包；如果系统提示权限，请允许浏览器或文件管理器安装未知应用。</div>`;
      const downloadUrl=data.downloadUrl||'';
      const resolvedDownloadUrl=/^https?:\/\//i.test(downloadUrl)?downloadUrl:`${apiBase}/${downloadUrl.replace(/^\/+/,'')}`;
      document.getElementById('download').onclick=()=>{window.location.href=resolvedDownloadUrl};
      qr.classList.remove('hidden');qr.innerHTML=`<img src="https://quickchart.io/qr?size=220&text=${encodeURIComponent(pageUrl)}" alt="扫码打开下载页"><div class="hint">手机扫码打开本页面<br>仍需点击“下载 APK”</div>`;
    }
    fetch(`${apiBase}/app/app_update/latest?packageName=${encodeURIComponent(packageName)}&platform=android`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(r=>render(r.data||r)).catch(e=>{main.innerHTML=`<div class="state error">获取版本失败：${escapeHtml(e.message)}<br><button class="download" onclick="location.reload()">重新加载</button></div>`});
  </script>
</body>
</html>
